name: Update generated chain metadata

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-generated-chain-metadata
  cancel-in-progress: false

jobs:
  updateL2Data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config dependencies
        run: pnpm build:dependencies:config

      - name: Generate chain metadata
        run: |
          pnpm --filter @l2beat/blobs-guru-raw-data layer2-details-full
          pnpm --filter @l2beat/blobs-guru-raw-data DA-details-full

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          delete-branch: true
          author: Data parser bot <bot-12345@protonmail.com>
          committer: Data parser bot <bot-12345@protonmail.com>
          commit-message: "chore[layer2]: Update data full"
          title: "chore[layer2]: Update data full"
          body: |
            Update generated L2 and data-availability metadata.

            Auto-generated by [create-pull-request](https://github.com/peter-evans/create-pull-request).
          labels: automerge
          branch: update-layer2-parsed-data-full
